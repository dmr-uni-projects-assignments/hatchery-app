<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Chat</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Fonts + Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css" />

    <style>
        /* =========================
           CHAT LAYOUT
        ========================== */

        .chat-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 140px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: var(--shadow-sm);
            white-space: pre-wrap;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-main);
            border-bottom-left-radius: 6px;
        }

        /* =========================
           TYPING BUBBLE
        ========================== */

        .typing-bubble {
            display: flex;
            align-items: flex-start;
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .typing-bubble .bubble {
            background: var(--bg-card);
            padding: 12px 14px;
            border-radius: 16px;
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* =========================
           INPUT BAR
        ========================== */

        .chat-input-bar {
            position: absolute;
            bottom: 72px;
            left: 0;
            right: 0;

            display: flex;
            gap: 10px;

            padding: 12px;
            background: var(--bg-card);
            border-top: 1px solid #E2E8F0;
        }

        .chat-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            font-size: 1rem;
            outline: none;
        }

        .chat-send {
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-send:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="app-fullscreen">

    <!-- HEADER -->
    <header class="app-header">
        <div class="avatar">
            <i class="ri-robot-line"></i>
        </div>
        <h1 class="welcome-text">AI Tutor Chat</h1>
    </header>

    <!-- CHAT AREA -->
    <main class="chat-wrapper">

        <div class="chat-messages" id="chatMessages">

            <div class="msg bot">
                Hi! I’m your digital literacy tutor. Ask me anything 😊
            </div>

        </div>

        <!-- typing bubble -->
        <div class="typing-bubble" id="typing" style="display:none;">
            <div class="bubble">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- INPUT -->
        <div class="chat-input-bar">
            <input id="chatInput" class="chat-input" placeholder="Ask something..." />
            <button class="chat-send" onclick="sendMessage()">Send</button>
        </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="ri-home-5-line"></i>
            <span>Home</span>
        </a>

        <a href="chat.html" class="nav-item active">
            <i class="ri-chat-3-line"></i>
            <span>Chat</span>
        </a>

        <a href="profile.html" class="nav-item">
            <i class="ri-user-6-line"></i>
            <span>Profile</span>
        </a>
    </nav>

</div>

<script>
    const sessionId = crypto.randomUUID();

    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const typing = document.getElementById("typing");

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.textContent = text;

        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        typing.style.display = "flex";
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
        typing.style.display = "none";
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        chatInput.value = "";

        showTyping();

        try {
            const res = await fetch("http://localhost:3000/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text,
                    sessionId
                })
            });

            const data = await res.json();

            hideTyping();
            addMessage(data.reply, "bot");

        } catch (err) {
            hideTyping();
            addMessage("Error: cannot reach server", "bot");
        }
    }

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
