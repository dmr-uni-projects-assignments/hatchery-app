<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Learning App Dashboard</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Fonts + Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="app-fullscreen">

        <!-- HEADER -->
        <header class="app-header">
            <div class="avatar">
                <i class="ri-user-3-line"></i>
            </div>
            <h1 class="welcome-text">Hi, TestUser</h1>
        </header>

        <!-- MAIN -->
        <main class="content-area">
            <a href="learn.html?course=internet" class="card-link">
                <div class="card" data-course="internet">
                    <div class="card-header">
                        <h2 class="card-title">How to use internet</h2>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar" style="width: 0%;"></div>
                        </div>
                        <span class="progress-percentage">0%</span>
                    </div>
                </div>
            </a>

            <a href="learn.html?course=network" class="card-link">
                <div class="card" data-course="network">
                    <div class="card-header">
                        <h2 class="card-title">Basic network</h2>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar" style="width: 0%;"></div>
                        </div>
                        <span class="progress-percentage">0%</span>
                    </div>
                </div>
            </a>

            <div class="card card-locked" data-course="uiux">
                <div class="card-header">
                    <h2 class="card-title">UI/UX Design</h2>

                </div>
                <div class="progress-container">
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" style="width: 0%;"></div>
                    </div>
                    <span class="progress-percentage">0%</span>
                </div>
            </div>

            <button class="btn btn-primary btn-block" id="continueBtn">
                Continue Lesson
            </button>

        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="ri-home-5-line"></i>
                <span>Home</span>
            </a>

            <a href="chat.html" class="nav-item">
                <i class="ri-chat-3-line"></i>
                <span>Chat</span>
            </a>

            <a href="profile.html" class="nav-item">
                <i class="ri-user-6-line"></i>
                <span>Profile</span>
            </a>
        </nav>

    </div>

    <!-- JS -->
    <script src="scripts/script.js"></script>
    <script src="scripts/index.js"></script>
</body>

</html>
